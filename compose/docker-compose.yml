services:
  linux_tweet_app:
    container_name: linux_tweet_app
    image: IMAGE
    ports:
      - 80

  nginx:
    container_name: nginx
    image: nginx:1.27-alpine-perl
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./PATH_TO_CERT/fullchain.pem:/etc/letsencrypt/live/DOMAIN/fullchain.pem
      - ./PATH_TO_CERT/privkey.pem:/etc/letsencrypt/live/DOMAIN/privkey.pem